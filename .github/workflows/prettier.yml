name: autofix-ci
on:
    pull_request:
    push:
permissions: 
    contents: write
jobs:
    autofix:
        if: >
         github.head_ref != 'main' &&
         github.event_name == 'pull_request'

        runs-on: ubuntu-latest
        env:
            CI: true
            HUSKY: 0
        steps:
            - uses: actions/checkout@v5
              with:
                fetch-depth: 0
            - uses: actions/setup-node@v5
              with: 
                node-version: '24'
                cache: 'npm'
            - name: Install dependencies
              run: npm ci

            - name: Prettier Check
              id: prettier_check
              run: npx prettier --check --ignore-path .prettierignore .
              continue-on-error: true

            - name: Run Prettier with autofix
              if: steps.prettier_check.outcome == 'failure'
              run: |
                npx prettier --write --ignore-path .prettierignore .
            - uses: autofix-ci/action@v1
              with:
                commit-message: "Autofix Prettier formatting applied"

            - name: Prettier re-check
              if: steps.prettier_check.outcome == 'failure'
              run: npx prettier --check --ignore-path .prettierignore .
    prettier:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        env:
            CI: true
            HUSKY: 0
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                node-version: '24'
                cache: 'npm'
            - name: Install dependencies
              run: npm ci
            - name: Run Prettier
              run: | 
                npx prettier --check --ignore-path .prettierignore .

